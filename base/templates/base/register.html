{% extends 'base/main.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'css/register.css' %}">

<h1>Register</h1>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
</form>



<p class="bottom-text">
    Already have an account? <a href="{% url 'login' %}">Login</a>
</p>

{% endblock content %}
